name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze npm
        run: npm install

      - name: Prepara cartella www/
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png www/ 2>/dev/null || true

      - name: Sync Capacitor -> Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Pubblica APK come release "latest"
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: LiFa (ultima build)
          allowUpdates: true
          removeArtifacts: true
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          body: "APK generato automaticamente dall'ultimo push su main."
