name: Bootstrap Android (una tantum)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze npm
        run: npm install

      - name: Prepara cartella www/
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png www/ 2>/dev/null || true

      - name: Aggiungi piattaforma Android
        run: npx cap add android

      - name: Sync Capacitor -> Android
        run: npx cap sync android

      - name: Commit e push della cartella android/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Genera piattaforma Android (Capacitor bootstrap)" || echo "Niente da committare"
          git push
